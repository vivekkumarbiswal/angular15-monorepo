<h2>RxJS Subject Demo</h2>

<div style="margin-bottom: 12px">
  <button (click)="emitValue()">Emit Value</button>
  <span style="margin-left: 12px">next value to emit: {{ value }}</span>
</div>

<hr />

<h3>Subject</h3>
<button (click)="subscribeSubject()">Subscribe to Subject</button>
<p>
  Logs: <strong>{{ subjectLogs.join(", ") }}</strong>
</p>

<hr />

<h3>BehaviorSubject</h3>
<button (click)="subscribeBehavior()">Subscribe to BehaviorSubject</button>
<p>
  Logs: <strong>{{ behaviorLogs.join(", ") }}</strong>
</p>

<hr />

<h3>ReplaySubject (buffer 2)</h3>
<button (click)="subscribeReplay()">Subscribe to ReplaySubject</button>
<p>
  Logs: <strong>{{ replayLogs.join(", ") }}</strong>
</p>

<hr />

<h3>AsyncSubject</h3>
<button (click)="subscribeAsync()">Subscribe to AsyncSubject</button>
<button (click)="completeAsync()">Complete AsyncSubject</button>
<p>
  Logs: <strong>{{ asyncLogs.join(", ") }}</strong>
</p>
