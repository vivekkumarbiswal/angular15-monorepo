<form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

  <h2>Login Form</h2>

  <div>
    <label>Email:</label>
    <input type="email" formControlName="email">

    <div *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.invalid">
      <small *ngIf="loginForm.get('email')?.errors?.['required']">
        Email is required
      </small>
      <small *ngIf="loginForm.get('email')?.errors?.['email']">
        Invalid email format
      </small>
    </div>
  </div>

  <div>
    <label>Password:</label>
    <input type="password" formControlName="password">

    <div *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid">
      <small *ngIf="loginForm.get('password')?.errors?.['required']">
        Password is required
      </small>
      <small *ngIf="loginForm.get('password')?.errors?.['minlength']">
        Minimum 6 characters required
      </small>
    </div>
  </div>

  <button type="submit" [disabled]="loginForm.invalid">
    Login
  </button>

</form>
